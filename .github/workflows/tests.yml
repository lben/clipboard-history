name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, Windows API and end-to-end tests
        env:
          CLIPHIST_E2E: "1"
          CLIPHIST_SCREENSHOTS: screenshots
        run: python -m unittest -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.python }}
          path: screenshots
          if-no-files-found: ignore
